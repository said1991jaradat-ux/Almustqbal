<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إستعادة كلمة المرور - نظام متابعة الطلاب</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .back-link {
            display: block;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>إعادة تعيين كلمة المرور</h2>
        <form onsubmit="resetPasswordAction(event)">
            <div class="form-group">
                <label for="newPassword">كلمة المرور الجديدة:</label>
                <input type="password" id="newPassword" required placeholder="أدخل كلمة المرور الجديدة">
            </div>
            <div class="form-group">
                <label for="confirmPassword">تأكيد كلمة المرور:</label>
                <input type="password" id="confirmPassword" required placeholder="أعد إدخال كلمة المرور">
            </div>
            <button type="submit">حفظ كلمة المرور الجديدة</button>
        </form>
        <a href="index.html" class="back-link">العودة لصفحة تسجيل الدخول</a>
    </div>

    <script>
        function resetPasswordAction(e) {
            e.preventDefault();
            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('confirmPassword').value;

            if (p1 !== p2) {
                alert('كلمتا المرور غير متطابقتين!');
                return;
            }

            alert('تم تغيير كلمة المرور بنجاح! يمكنك تسجيل الدخول الآن.');
            window.location.href = 'index.html'; // أو صفحة الدخول الخاصة بك
        }
    </script>
</body>
</html>
